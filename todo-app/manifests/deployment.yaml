apiVersion: apps/v1
kind: Deployment
metadata:
  name: mooc-project-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mooc-project
  template:
    metadata:
      labels:
        app: mooc-project
    spec:
      containers:
        - name: mooc-project
          image: eloizat/mooc-project:1.0.0